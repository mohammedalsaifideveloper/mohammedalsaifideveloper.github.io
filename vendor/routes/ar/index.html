vered/01bb3a5f1108-fdc11c71f44a473ab992aa1681a6b358.png\",\"publishType\":1},{\"id\":8,\"name_ar\":\"صيفي\",\"name_en\":\"SAIFI\",\"description_ar\":\"\",\"description_en\":\"\",\"main_icon_url\":\"/assets/recovered/433b456590cf-c0a00247302543aabe7cb7ada4d6bb9d.png\",\"publishType\":1}]},\"locale\":\"ar\"}]}]\n2b:T75a,شاركت محفظة صيفي في معرض بروج حواء، وهو معرض متخصص يُعنى بالمرأة والأسرة، ويُعد منصة مميزة تجمع بين التسوق، الإبداع، والخدمات المتنوعة في أجواء تفاعلية حديثة.\r\n\r\nهدفت مشاركة صيفي إلى التعريف بحلولها المالية الرقمية، وتسليط الضوء على دورها في تسهيل المعاملات اليومية وتمكين المستخدمين من إدارة أموالهم بسهولة وأمان. وقد استقبل فريق صيفي زوّار المعرض في جناح خاص، حيث قدّم شروحات مباشرة حول خدمات المحفظة وآلية استخدامها.\r\n\r\nشهد جناح صيفي إقبالًا ملحوظًا من الزائرات، مع تفاعل إيجابي واهتمام واضح بالخدمات التي توفّرها المحفظة، لا سيما:\r\n\r\nخدمات الدفع الإلكتروني\r\n\r\nالشحن والتسديد\r\n\r\nالتحويلات المالية السريعة\r\n\r\nإدارة المصروفات بطريقة ذكية\r\n\r\nكما حرصت صيفي خلال مشاركتها على تعزيز الوعي بأهمية الحلول المالية الرقمية في دعم الاستقلال المالي وتسهيل نمط الحياة اليومي، مع التركيز على البساطة، الأمان، وسهولة الاستخدام.\r\n\r\nوتأتي مشاركة صيفي في معرض بروج حواء ضمن جهودها المستمرة للتواجد في الفعاليات المجتمعية، والتواصل المباشر مع مختلف فئات المجتمع، بما يعكس التزامها بتقديم خدمات مالية رقمية تلبي الاحتياجات المتجددة بأسلوب عصري وموثوق.2c:T807,شاركت محفظة صيفي بفعالية مميزة في معرض بروج العائلي، الذي يُعدّ من أبرز الفعاليات الاجتماعية والتسويقية المخصصة للعائلات، حيث جمع بين التسوق والترفيه والخدمات المتنوعة في مكان واحد.\r\n\r\nجاءت مشاركة صيفي بهدف تعزيز الوعي بالخدمات المالية الرقمية التي تقدّمها للجمهور، وتيسير الوصول إلى حلول الدفع والتحويلات وإدارة الأموال بطريقة آمنة وسلسة. وقد ظهر فريق صيفي في جناح مخصّص للتواصل مع الزوّار، والاستماع إلى استفساراتهم حول الخدمة، والاستفادة من تجاربهم العملية.\r\n\r\nتميزت المشاركة بتفاعل كبير من الزوار، الذين أبدوا اهتمامًا بالخبرات الرقمية التي توفرها صيفي، خصوصًا في مجالات:\r\n\r\nالتحويلات المالية الفورية\r\n\r\nخدمات السداد والشحن\r\n\r\nالدفع عبر QR\r\n\r\nمتابعة وإدارة الفواتير\r\n\r\nوقد حقق جناح صيفي حضورًا قويًا في المعرض، مما أسهم في توسيع قاعدة المستخدمين وتعزيز علاقة الثقة بين صيفي والمجتمع. كما قدّمت صيفي عروضًا تعريفية وتوعوية حول كيفية استخدام الخدمات المالية الرقمية في الحياة اليومية، مع تركيز خاص على البساطة والأمان.\r\n\r\nتأتي مشاركة صيفي في معرض بروج العائلي كجزء من استراتيجيتها للتواصل المباشر مع المجتمع، ونشر ثقافة التحوّل الرقمي في المعاملات المالية، لدعم تنمية الاقتصاد الرقمي وتلبية احتياجات العملاء بأسلوب عصري وفعّال.25:[\"$\",\"section\",null,{\"aria-label\":\"News section\",\"children\":[\"$\",\"$L2a\",null,{\"data\":{\"title\":\"من محفظة صيفي وإليها\",\"description\":\"مستجدات، تحديثات، وفعاليات تبقيك قريبا من كل جديد فى عالم صيفي\",\"cards\":[{\"id\":31,\"title\":\"مليون صيفي\",\"description\":\"في إنجاز يُعدّ من أبرز المحطات في مسيرتها، احتفلت محفظة صيفي بوصولها إلى أكثر من مليون مستخدم، في حفل...\",\"fullDescription\":\"في إنجاز يُعدّ من أبرز المحطات في مسيرتها، احتفلت محفظة صيفي بوصولها إلى أكثر من مليون مستخدم، في حفل خاص عكس حجم النجاح الذي حققته المنصة خلال فترة زمنية قصيرة.\\r\\n\\r\\nالحفل جمع فريق العمل والشركاء في أجواء احتفالية تعبّر عن ثمرة الجهود المتواصلة والعمل الجماعي الذي قاد إلى هذا الإنجاز، مؤكّدًا مكانة صيفي كأحد الحلول المالية الرقمية الرائدة التي تحظى بثقة شريحة واسعة من المستخدمين.\\r\\n\\r\\nويأتي هذا الإنجاز تتويجًا لرؤية واضحة تهدف إلى تبسيط المعاملات المالية وتقديم خدمات ذكية تواكب احتياجات المستخدم، مع تأكيد القائمين على صيفي أن المرحلة القادمة ستحمل تطويرات وخدمات جديدة تعزّز من تجربة المستخدم وتوسّع نطاق التأثير.\",\"image_url\":\"/assets/recovered/24afda2c7414-876af291355e4ca1aef6d63c3b0f00a6.jpg\",\"date\":\"2025-11-09\",\"time\":\"01:32 PM\",\"notes\":null,\"publishType\":1,\"imageData\":{\"id\":184,\"imageName\":\"مليون صيفي\",\"description\":\"احتفال مليون صيفي\",\"altText\":\"مليون صيفي\",\"imageUrl\":\"/assets/recovered/24afda2c7414-876af291355e4ca1aef6d63c3b0f00a6.jpg\",\"order\":19}},{\"id\":
